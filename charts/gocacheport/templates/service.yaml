apiVersion: v1
kind: Service
metadata:
  name: {{ include "gocacheport.fullname" . }}
  labels:
    {{- include "gocacheport.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gocacheport.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gocacheport.fullname" . }}-admin
  labels:
    {{- include "gocacheport.labels" . | nindent 4 }}
    gocacheport.io/component: admin
  {{- if .Values.metrics.scrapeAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.admin.port | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "gocacheport.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: admin
